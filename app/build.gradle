plugins { id 'com.android.application' }
android {
 namespace 'com.g4t0xx.forge'
 compileSdk 35
 defaultConfig { applicationId 'com.g4t0xx.forge'; minSdk 28; targetSdk 35; versionCode 2; versionName '1.1.0'; ndk { abiFilters 'arm64-v8a' } }
 packagingOptions { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] } }
 buildFeatures { buildConfig true }
 signingConfigs { release { if (System.getenv('FORGE_KEYSTORE')) { storeFile file(System.getenv('FORGE_KEYSTORE')); storePassword System.getenv('FORGE_STORE_PASSWORD'); keyAlias 'forge'; keyPassword System.getenv('FORGE_STORE_PASSWORD') } } }
 buildTypes { debug { if (System.getenv('FORGE_KEYSTORE')) signingConfig signingConfigs.release }; release { minifyEnabled false; if (System.getenv('FORGE_KEYSTORE')) signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
