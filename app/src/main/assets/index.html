<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-src 'none'; object-src 'none'"><title>Forge · Assistente</title><link rel="stylesheet" href="style.css"></head><body><aside id="sidebar"><div class="row"><h2>Forge</h2><button id="closeSidebar" class="icon" aria-label="Fechar conversas">×</button></div><button id="newChat" class="outline wide">＋ Nova conversa</button><div id="threads"></div><button id="memoryShortcut" class="outline wide">Memória pessoal</button><p class="caption">Sua conversa continua aqui.</p></aside><div id="shell"><header><button id="menu" class="icon" aria-label="Abrir conversas">☰</button><button id="modelButton" class="model">Forge <span id="modelName">Local</span>⌄</button><button id="settings" class="icon" aria-label="Configurações">⚙</button></header><main id="conversation" aria-label="Conversa"><section id="welcome"><div class="emblem">F</div><h1>Vamos fazer<br>acontecer.</h1><p>Suas ideias, seus projetos e uma<br>memória que acompanha você.</p><div class="suggestions"><button data-suggest="O que você lembra sobre mim e meus projetos?">O que você lembra de mim?</button><button data-suggest="Consulte device_info e liste os recursos deste dispositivo.">Conhecer meu dispositivo</button><button data-suggest="Crie ideias.md com um plano para meu próximo projeto.">Começar um projeto</button><button data-suggest="Me ajude a planejar a edição de gameplay com minhas preferências.">Editar com IA</button></div></section><div id="messages"></div><section id="job" aria-live="polite"></section></main><footer><div class="composer"><textarea id="prompt" rows="1" aria-label="Mensagem para o Forge" placeholder="Converse com o Forge" maxlength="30000"></textarea><div class="composerbar"><div class="tools"><button id="attach" class="icon" aria-label="Importar arquivo">＋</button><button id="accessButton" class="access">◈ <span id="accessLabel">Solicitar aprovação</span>⌄</button></div><div class="tools"><button id="microphone" class="icon" aria-label="Ditar mensagem">♩</button><button id="voiceMode" class="icon" aria-label="Modo de voz">◉</button><button id="send" class="send" aria-label="Enviar mensagem">↑</button></div></div></div><div id="statusline" class="caption" role="status">Memória local · pronto para conversar</div></footer></div><dialog id="dialog" aria-labelledby="dialogTitle"><div class="row"><h2 id="dialogTitle"></h2><button id="closeDialog" class="icon" aria-label="Fechar">×</button></div><div id="detail"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
