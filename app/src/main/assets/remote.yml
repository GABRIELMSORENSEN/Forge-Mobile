name: Forge Remote
run-name: '${{ inputs.mode }} · ${{ inputs.target }} · ${{ inputs.request_id }}'
on:
  workflow_dispatch:
    inputs:
      task:
        description: Pedido ou comando
        required: true
        type: string
      target:
        description: Repositório dono/nome
        required: true
        type: string
      runner:
        type: choice
        options: [ubuntu-latest, windows-latest]
        default: ubuntu-latest
      mode:
        type: choice
        options: [agent, shell, diagnostic]
        default: agent
      request_id:
        type: string
        required: true
      ref:
        description: Branch para continuar (vazio usa a padrão)
        type: string
      model:
        description: Modelo (vazio usa o padrão do Codex)
        type: string
permissions:
  contents: read
concurrency:
  group: forge-personal-agent
  cancel-in-progress: false
jobs:
  execute:
    if: github.event.repository.private && github.actor == github.repository_owner
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Codex
        if: inputs.mode == 'agent'
        run: npm install -g @openai/codex@0.155.1
      - name: Executar tarefa
        env:
          FORGE_TASK: ${{ inputs.task }}
          FORGE_TARGET: ${{ inputs.target }}
          FORGE_MODE: ${{ inputs.mode }}
          FORGE_REF: ${{ inputs.ref }}
          FORGE_MODEL: ${{ inputs.model }}
          FORGE_REQUEST_ID: ${{ inputs.request_id }}
          GH_TOKEN: ${{ secrets.FORGE_GITHUB_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python remote/runner.py
      - name: Publicar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: .work/result/result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publicar arquivos gerados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: .work/output/
          if-no-files-found: ignore
          retention-days: 14
